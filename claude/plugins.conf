# 새 기기에서 자동 설치할 마켓플레이스와 플러그인 목록.
# install.sh 가 이 파일을 읽어 claude CLI 로 설치한다. 이미 있으면 건너뛴다.
#
# 형식
#   marketplace <이름> <소스>        소스는 GitHub 저장소(owner/repo), URL, 로컬 경로
#   plugin      <이름@마켓플레이스>
#
# 플러그인을 켜는 설정은 claude/settings.json 의 enabledPlugins 에 따로 있다.
# 여기에 추가했으면 그쪽에도 추가해야 실제로 켜진다.

marketplace claude-plugins-official anthropics/claude-plugins-official

plugin superpowers@claude-plugins-official
