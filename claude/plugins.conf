# 새 기기에서 설치할 Claude Code 플러그인 목록
# install.sh 실행 시 아래 목록을 확인하고, 이미 설치된 항목은 건너뛴다.
#
# marketplace <이름> <GitHub 저장소 또는 URL>
# plugin <플러그인명@마켓플레이스>
#
# 플러그인 활성화 설정은 claude/settings.json의 enabledPlugins에서 관리한다.
# 플러그인을 추가했다면 해당 설정에도 추가해야 한다.

marketplace claude-plugins-official anthropics/claude-plugins-official

plugin superpowers@claude-plugins-official